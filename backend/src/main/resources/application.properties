# ============================================================
# CareConnect Backend — Application Properties
# ============================================================
# IMPORTANT: Never hard-code credentials here.
# Credentials are read from environment variables (see README).
# ============================================================

# ----- Server -----
server.port=8080

# ----- Application name -----
spring.application.name=careconnect-backend

# ----- Oracle Database Connection -----
# Credentials are read from env vars with sensible Oracle Free container defaults:
spring.datasource.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_DB_USERNAME:CARECONNECT123}
spring.datasource.password=${ORACLE_DB_PASSWORD:careconnect123}

# Oracle JDBC driver class (part of ojdbc11 — no extra config needed)
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ----- JPA / Hibernate -----
# validate = checks the DB schema matches entities (safe for development)
# none     = disable schema auto-management (use for production + explicit SQL)
spring.jpa.hibernate.ddl-auto=validate

# Show SQL queries in console (helpful during development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Oracle dialect for Hibernate query generation
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ----- CORS -----
# This is also configured in CorsConfig.java; kept here for clarity.
careconnect.cors.allowed-origin=${CARECONNECT_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ----- JWT Security -----
careconnect.jwt.secret=${JWT_SECRET:careconnect-super-secure-production-ready-jwt-secret-key-at-least-256-bits-long}
careconnect.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
careconnect.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}

# ----- Cookie Security -----
careconnect.security.cookie.secure=${COOKIE_SECURE:false}
careconnect.security.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# ----- Email OTP Settings -----
careconnect.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}
careconnect.otp.resend-interval-seconds=${OTP_RESEND_INTERVAL_SECONDS:60}
careconnect.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}

# ----- Mail Provider (SMTP) -----
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
careconnect.mail.from=${MAIL_FROM:}

# ----- Logging -----
logging.level.com.careconnect=DEBUG
logging.level.org.springframework.web=INFO
